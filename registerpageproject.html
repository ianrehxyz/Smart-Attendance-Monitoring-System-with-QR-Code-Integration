<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register & Login - TCU Smart Attendance System</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-red: #ed1c24;
      --accent-gold: #fca311;
      --accent-blue: #1a4da6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }

    header { background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(10px); border-bottom: 2px solid var(--accent-red); position: sticky; top: 0; z-index: 100; }
    nav { max-width: 1200px; margin: 0 auto; padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .logo-container { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: #fff; font-weight: 700; }
    .logo-container img { height: 48px; width: auto; object-fit: contain; }
    .nav-links { display: flex; gap: 1.25rem; list-style: none; align-items: center; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.875rem; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--accent-gold); }
    .btn-login-nav { background-color: var(--accent-red); color: #fff !important; padding: 0.35rem 0.85rem; border-radius: 6px; font-weight: 600 !important; }

    .main-container { max-width: 500px; margin: 2rem auto; width: 100%; padding: 0 1rem; flex: 1; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 2rem; }
    .card-title { font-size: 1.5rem; font-weight: 800; color: #fff; text-align: center; margin-bottom: 0.5rem; }
    .card-subtitle { font-size: 0.85rem; color: var(--text-secondary); text-align: center; margin-bottom: 1.5rem; }

    .role-switch { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    .role-btn { flex: 1; padding: 0.6rem; border: 1px solid var(--border-color); background: #0d1117; color: var(--text-secondary); font-weight: 700; border-radius: 6px; cursor: pointer; text-align: center; font-size: 0.9rem; }
    .role-btn.active-student { background: var(--accent-gold); color: #0d1117; border-color: var(--accent-gold); }
    .role-btn.active-faculty { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

    .form-group { display: flex; flex-direction: column; margin-bottom: 1rem; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.3rem; }
    .form-control { width: 100%; padding: 0.7rem; background: #0d1117; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; color: #fff; font-size: 0.875rem; outline: none; }
    .form-control:focus { border-color: var(--accent-gold); }

    .btn-submit { width: 100%; padding: 0.8rem; background: var(--accent-gold); color: #0d1117; border: none; border-radius: 6px; font-weight: 800; font-size: 0.95rem; cursor: pointer; margin-top: 1rem; }
    .btn-submit:hover { background: #e0920a; }

    .switch-mode { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--text-secondary); }
    .switch-mode a { color: var(--accent-gold); text-decoration: none; font-weight: 600; }
  </style>
  <link rel="stylesheet" href="glass-theme.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo-container">
        <img src="TCU_logo_2024.png" alt="TCU Logo">
        <span>TCU Attendance</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="logpageproject.html" class="btn-login-nav">Login</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-container">
    <div class="card">
      <h2 class="card-title" id="formTitle">Create Student Account</h2>
      <p class="card-subtitle" id="formSubtitle">Register your details for attendance tracking</p>

      <div class="role-switch">
        <div class="role-btn active-student" id="btnStudent" onclick="switchRole('student')">Student</div>
        <div class="role-btn" id="btnFaculty" onclick="switchRole('faculty')">Faculty</div>
      </div>

      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" class="form-control" placeholder="e.g., Juan Dela Cruz" required>
        </div>

        <div class="form-group">
          <label id="idLabel">Student ID Number</label>
          <input type="text" id="regId" class="form-control" placeholder="e.g., 2026-100234" required>
        </div>

        <div class="form-group">
          <label>TCU Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="username@tcu.edu.ph" required>
        </div>

        <!-- Department Selection -->
        <div class="form-group">
          <label id="deptLabel">Department</label>
          <select id="regDept" class="form-control" onchange="updateCourses()" required>
            <option value="">Select Department</option>
            <option value="CICT">CICT</option>
            <option value="CCJ">CCJ</option>
            <option value="CHTM">CHTM</option>
            <option value="CILT">CILT</option>
            <option value="CBM">CBM</option>
            <option value="CAS">CAS</option>
          </select>
        </div>

        <!-- Course Selection (Dynamic for Students, Hidden/Optional for Faculty) -->
        <div class="form-group" id="courseGroup">
          <label id="courseLabel">Course / Program</label>
          <select id="regCourse" class="form-control" required>
            <option value="">Select Department First</option>
          </select>
        </div>

        <div class="form-group" id="facultyCodeGroup" style="display: none;">
          <label style="color: #38bdf8;">Faculty Access Code / Authorization Key</label>
          <input type="password" id="regFacultyCode" class="form-control" placeholder="Enter authorized security key">
          <small style="color: #94a3b8; font-size: 0.75rem; margin-top: 0.25rem;">Required for faculty verification.</small>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPass" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit" id="regSubmitBtn">Register Student Account</button>
      </form>

      <div class="switch-mode">
        Already have an account? <a href="logpageproject.html">Login here</a>
      </div>
    </div>
  </main>

  <script>
    let currentRole = 'student';

    const departmentCourses = {
      "CICT": ["Information Systems", "Computer Science"],
      "CCJ": ["Criminology"],
      "CHTM": ["Hospitality & Tourism Management"],
      "CILT": ["Elementary Education", "Secondary Education"],
      "CBM": ["Business Administration", "Entrepreneurship / Entrepreneurial Management", "Office Administration / Office Management"],
      "CAS": ["Psychology", "Public Administration"]
    };

    function updateCourses() {
      const deptSelect = document.getElementById('regDept');
      const courseSelect = document.getElementById('regCourse');
      const chosenDept = deptSelect.value;

      courseSelect.innerHTML = '<option value="">Select Course</option>';

      if (currentRole === 'faculty') return;

      if (chosenDept && departmentCourses[chosenDept]) {
        departmentCourses[chosenDept].forEach(course => {
          const opt = document.createElement('option');
          opt.value = course;
          opt.textContent = course;
          courseSelect.appendChild(opt);
        });
      }
    }

    function switchRole(role) {
      currentRole = role;
      const btnStu = document.getElementById('btnStudent');
      const btnFac = document.getElementById('btnFaculty');
      const title = document.getElementById('formTitle');
      const sub = document.getElementById('formSubtitle');
      const idLbl = document.getElementById('idLabel');
      const deptLbl = document.getElementById('deptLabel');
      const courseGroup = document.getElementById('courseGroup');
      const regCourse = document.getElementById('regCourse');
      const subBtn = document.getElementById('regSubmitBtn');
      const facultyCodeGroup = document.getElementById('facultyCodeGroup');
      const facultyCodeInput = document.getElementById('regFacultyCode');
      const regDept = document.getElementById('regDept');

      regDept.value = ""; // Reset department selection

      if (role === 'student') {
        btnStu.className = 'role-btn active-student';
        btnFac.className = 'role-btn';
        title.textContent = 'Create Student Account';
        sub.textContent = 'Register your details for attendance tracking';
        idLbl.textContent = 'Student ID Number';
        deptLbl.textContent = 'Department';
        courseGroup.style.display = 'flex';
        regCourse.setAttribute('required', 'true');
        subBtn.textContent = 'Register Student Account';
        subBtn.style.background = '#fca311';
        subBtn.style.color = '#0d1117';
        
        facultyCodeGroup.style.display = 'none';
        facultyCodeInput.removeAttribute('required');
      } else {
        btnFac.className = 'role-btn active-faculty';
        btnStu.className = 'role-btn';
        title.textContent = 'Create Faculty Account';
        sub.textContent = 'Register your details for class QR tracking';
        idLbl.textContent = 'Faculty ID Number';
        deptLbl.textContent = 'Department / College';
        courseGroup.style.display = 'none'; // Faculty don't need specific program
        regCourse.removeAttribute('required');
        subBtn.textContent = 'Register Faculty Account';
        subBtn.style.background = '#1a4da6';
        subBtn.style.color = '#fff';
        
        facultyCodeGroup.style.display = 'flex';
        facultyCodeInput.setAttribute('required', 'true');
      }
      updateCourses();
    }
  </script>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAUe90Z8XTSKSPJNwFEsV41ZQnv-oUGRmA",
      authDomain: "smart-attendance-68397.firebaseapp.com",
      projectId: "smart-attendance-68397",
      storageBucket: "smart-attendance-68397.firebasestorage.app",
      messagingSenderId: "47063749826",
      appId: "1:47063749826:web:06b25a63b19836d009575b",
      measurementId: "G-KBPYMMT4B1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.handleRegister = async function(e) {
      e.preventDefault();
      
      const name = document.getElementById('regName').value.trim();
      const id = document.getElementById('regId').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const department = document.getElementById('regDept').value;
      const course = currentRole === 'student' ? document.getElementById('regCourse').value : '';
      const pass = document.getElementById('regPass').value;

      if (currentRole === 'faculty') {
        const enteredCode = document.getElementById('regFacultyCode').value.trim();
        const validFacultySecrets = [
          "TCU-FACULTY-2026", "TCU-FACULTY-2027", "TCU-FACULTY-2028", "TCU-FACULTY-2029", "TCU-FACULTY-2030"
        ];

        if (!validFacultySecrets.includes(enteredCode)) {
          alert('Access Denied: Invalid Faculty Authorization Code! Only authorized professors can register.');
          return;
        }
      }

      const userData = { 
        fullName: name, 
        idNumber: id, 
        email: email, 
        department: department,
        course: course,
        role: currentRole,
        registeredAt: serverTimestamp() 
      };

      try {
        const collectionName = currentRole === 'student' ? 'students' : 'faculty';
        
        // Save to Firebase Firestore online
        await addDoc(collection(db, collectionName), userData);

        // Backup to LocalStorage para sa login system mo
        if (currentRole === 'student') {
          let students = JSON.parse(localStorage.getItem('tcu_registered_students')) || [];
          students.push({ name, id, email, department, course, pass });
          localStorage.setItem('tcu_registered_students', JSON.stringify(students));
        } else {
          let facultyList = JSON.parse(localStorage.getItem('tcu_registered_faculty')) || [];
          facultyList.push({ name, id, email, department, pass });
          localStorage.setItem('tcu_registered_faculty', JSON.stringify(facultyList));
        }

        alert(`${currentRole === 'student' ? 'Student' : 'Faculty'} account registered successfully online!`);
        window.location.href = 'logpageproject.html';

      } catch (error) {
        console.error("Error saving data to Firebase: ", error);
        alert("Failed to register to database. Please check your internet connection.");
      }
    };
  </script>
</body>
</html>
