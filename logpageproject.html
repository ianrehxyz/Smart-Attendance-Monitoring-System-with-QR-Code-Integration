<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TCU Smart Attendance System</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-red: #ed1c24;
      --accent-gold: #fca311;
      --accent-blue: #1a4da6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }

    header { background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(10px); border-bottom: 2px solid var(--accent-red); position: sticky; top: 0; z-index: 100; }
    nav { max-width: 1200px; margin: 0 auto; padding: 0.8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .logo-container { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: #fff; font-weight: 700; }
    .logo-container img { height: 48px; width: auto; object-fit: contain; }
    .nav-links { display: flex; gap: 1.25rem; list-style: none; align-items: center; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.875rem; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--accent-gold); }
    .btn-reg-nav { background-color: var(--accent-gold); color: #0d1117 !important; padding: 0.35rem 0.85rem; border-radius: 6px; font-weight: 600 !important; }

    .main-container { max-width: 450px; margin: 3rem auto; width: 100%; padding: 0 1rem; flex: 1; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 2rem; }
    .card-title { font-size: 1.5rem; font-weight: 800; color: #fff; text-align: center; margin-bottom: 0.5rem; }
    .card-subtitle { font-size: 0.85rem; color: var(--text-secondary); text-align: center; margin-bottom: 1.5rem; }

    .role-switch { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    .role-btn { flex: 1; padding: 0.6rem; border: 1px solid var(--border-color); background: #0d1117; color: var(--text-secondary); font-weight: 700; border-radius: 6px; cursor: pointer; text-align: center; font-size: 0.9rem; }
    .role-btn.active-student { background: var(--accent-gold); color: #0d1117; border-color: var(--accent-gold); }
    .role-btn.active-faculty { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

    .form-group { display: flex; flex-direction: column; margin-bottom: 1rem; }
    .form-group label { font-size: 0.8rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.3rem; }
    .form-control { width: 100%; padding: 0.7rem; background: #0d1117; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 6px; color: #fff; font-size: 0.875rem; outline: none; }
    .form-control:focus { border-color: var(--accent-gold); }

    .btn-submit { width: 100%; padding: 0.8rem; background: var(--accent-gold); color: #0d1117; border: none; border-radius: 6px; font-weight: 800; font-size: 0.95rem; cursor: pointer; margin-top: 1rem; }
    .btn-submit:hover { background: #e0920a; }

    .switch-mode { text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--text-secondary); }
    .switch-mode a { color: var(--accent-gold); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo-container">
        <img src="TCU_logo_2024.png" alt="TCU Logo">
        <span>TCU Attendance</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="registerpageproject.html" class="btn-reg-nav">Register</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-container">
    <div class="card">
      <h2 class="card-title" id="loginTitle">Student Login</h2>
      <p class="card-subtitle" id="loginSubtitle">Enter your credentials to access your attendance portal</p>

      <div class="role-switch">
        <div class="role-btn active-student" id="btnStudent" onclick="switchLoginRole('student')">Student</div>
        <div class="role-btn" id="btnFaculty" onclick="switchLoginRole('faculty')">Faculty</div>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label id="emailLabel">TCU Email or Student ID</label>
          <input type="text" id="logUser" class="form-control" placeholder="username@tcu.edu.ph or ID" required>
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="logPass" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit" id="logSubmitBtn">Login as Student</button>
      </form>

      <div class="switch-mode">
        Don't have an account? <a href="registerpageproject.html">Register here</a>
      </div>
    </div>
  </main>

  <script>
    let currentLoginRole = 'student';

    function switchLoginRole(role) {
      currentLoginRole = role;
      const btnStu = document.getElementById('btnStudent');
      const btnFac = document.getElementById('btnFaculty');
      const title = document.getElementById('loginTitle');
      const sub = document.getElementById('loginSubtitle');
      const emailLbl = document.getElementById('emailLabel');
      const subBtn = document.getElementById('logSubmitBtn');

      if (role === 'student') {
        btnStu.className = 'role-btn active-student';
        btnFac.className = 'role-btn';
        title.textContent = 'Student Login';
        sub.textContent = 'Enter your credentials to access your attendance portal';
        emailLbl.textContent = 'TCU Email or Student ID';
        subBtn.textContent = 'Login as Student';
        subBtn.style.background = '#fca311';
        subBtn.style.color = '#0d1117';
      } else {
        btnFac.className = 'role-btn active-faculty';
        btnStu.className = 'role-btn';
        title.textContent = 'Faculty Login';
        sub.textContent = 'Enter your credentials to access faculty panel';
        emailLbl.textContent = 'TCU Email or Faculty ID';
        subBtn.textContent = 'Login as Faculty';
        subBtn.style.background = '#1a4da6';
        subBtn.style.color = '#fff';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('logUser').value.trim();
      const pass = document.getElementById('logPass').value;

      if (currentLoginRole === 'student') {
        const students = JSON.parse(localStorage.getItem('tcu_registered_students')) || [];
        
        const found = students.find(s => (s.email === identifier || s.id === identifier) && s.pass === pass);
        
        if (!found) {
          alert('Invalid Student ID/Email or Password. Please check your credentials or register first.');
          return;
        }

        // Save active user session
        localStorage.setItem('tcu_student_user', JSON.stringify(found));
        alert('Login successful! Redirecting to student portal...');
        window.location.href = 'studentprojectpage.html';

      } else {
        const facultyList = JSON.parse(localStorage.getItem('tcu_registered_faculty')) || [];
        
        const found = facultyList.find(f => (f.email === identifier || f.id === identifier) && f.pass === pass);
        
        if (!found) {
          alert('Invalid Faculty ID/Email or Password. Please check your credentials.');
          return;
        }

        // Save active faculty session
        localStorage.setItem('tcu_faculty_user', JSON.stringify(found));
        alert('Login successful! Redirecting to faculty portal...');
        window.location.href = 'facultyprojectpage.html'; // Adjust filename if your faculty dashboard differs
      }
    }
  </script>
</body>
</html>
